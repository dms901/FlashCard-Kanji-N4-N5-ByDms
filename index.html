        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #fcfcfd;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .preserve-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .card-inner {
            transition: transform .6s cubic-bezier(.4, 0, .2, 1);
        }

        .shadow-premium {
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, .05);
        }

        .active-part {
            background: #fef2f2;
            color: #ef4444;
            border-left: 4px solid #ef4444;
        }

        .dropdown-content {
            transform-origin: top;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        @keyframes shuffle-pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05) rotate(2deg);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-shuffle {
            animation: shuffle-pop .4s ease-out;
        }

        .mastered {
            background: #f0fdf4 !important;
            border-color: #bbf7d0 !important;
        }

        #app {
            display: none;
        }

        #loadingScreen {
            display: flex;
        }
    </style>
</head>

            document.getElementById("passwordInput").autocomplete =

        }


        /* =====================================================
           AUTH MESSAGE
        ===================================================== */

        function authMessage(text, error = true) {

            const box =
                document.getElementById("authMessage");

            box.innerText = text;

            box.classList.remove(
                "hidden",
                "bg-red-50",
                "text-red-500",
                "bg-green-50",
                "text-green-600"
            );

            if (error) {

                box.classList.add(
                    "bg-red-50",
                    "text-red-500"
                );

            } else {

                box.classList.add(
                    "bg-green-50",
                    "text-green-600"
                );

            }
        }

                document
                .getElementById("passwordInput")
                .value;

            const button =
                document.getElementById("authButton");

            button.disabled = true;

            button.innerText =
                "Memproses...";


            try {

                if (authMode === "register") {

                    const { data, error } =
                        await supabaseClient.auth.signUp({
                            email: email,
                            password: password
                        });


                    if (error) {
                        throw error;
                    }


                    if (!data.session) {

                        authMessage(
                            "Akun berhasil dibuat. Cek email untuk verifikasi.",
                            false
                        );

                        button.disabled = false;

                        button.innerText =
                            "Buat Akun";

                        return;
                    }

                } else {

                    const { error } =
                        await supabaseClient.auth.signInWithPassword({
                            email: email,
                            password: password
                        });


                    if (error) {
                        throw error;
                    }
                }

            } catch (error) {

                console.error(error);

                authMessage(
                    error.message ||
                    "Terjadi kesalahan."
                );
            }


            button.disabled = false;

            button.innerText =
                authMode === "login"
                    ? "Login"
                    : "Buat Akun";
        }


        /* =====================================================
           SESSION
        ===================================================== */

        async function checkSession() {

            const { data } =
                await supabaseClient
                .auth
                .getSession();


            currentUser =
                data.session
                    ? data.session.user
                    : null;


            if (currentUser) {

                await startApp();

            } else {

                showAuth();

            }


            supabaseClient.auth.onAuthStateChange(
                async (event, session) => {

                    currentUser =
                        session
                            ? session.user
                            : null;


                    if (currentUser) {

                        await startApp();

                    } else {

                        showAuth();

                    }

                }
            );
        }


        /* =====================================================
           SHOW AUTH
        ===================================================== */

        function showAuth() {

            document.getElementById("loadingScreen")
                .style.display = "none";

            document.getElementById("app")
                .style.display = "none";

            document.getElementById("authScreen")
                .classList.remove("hidden");

            document.getElementById("authScreen")
                .classList.add("flex");
        }


        /* =====================================================
           START APP
        ===================================================== */

        async function startApp() {

            document.getElementById("loadingScreen")
                .style.display = "none";

            document.getElementById("authScreen")
                .classList.add("hidden");

            document.getElementById("authScreen")
                .classList.remove("flex");

            document.getElementById("app")
                .style.display = "flex";


            await loadProgress();


            currentPart = 1;

            currentData =
                [...(allData[1] || [])];

            currentIndex = 0;


            document.getElementById(
                "currentPartTitle"
            ).innerText = "Bagian 1";


            initDropdown();

            render();

            updateTotalProgress();
        }


        /* =====================================================
           LOAD PROGRESS
        ===================================================== */

        async function loadProgress() {

            progressMap = {};


            if (!currentUser) {
                return;
            }


            const { data, error } =
                await supabaseClient
                .from("card_progress")
                .select("*")
                .eq("user_id", currentUser.id);


            if (error) {

                console.error(
                    "Gagal mengambil progress:",
                    error
                );

                return;
            }


            for (const row of data || []) {

                progressMap[row.card_id] =
                    row;
            }
        }


        /* =====================================================
           CARD ID
        ===================================================== */

        function getCardId(part, item) {

            return `part${part}_${item.k}`;
        }


        /* =====================================================
           IS MASTERED
        ===================================================== */

       function isMastered(item) {
    const id = getCardId(currentPart, item);

    return progressMap[id]?.status === "mastered";
}


        /* =====================================================
           SAVE PROGRESS
        ===================================================== */

      async function toggleMastered(event) {

    event.stopPropagation();

    const item = currentData[currentIndex];

    if (!item || !currentUser) return;

    const cardId = getCardId(currentPart, item);

    const mastered = isMastered(item);

    try {

        // ==========================================
        // KALAU SUDAH HAFAL → HAPUS DARI DATABASE
        // ==========================================

        if (mastered) {

            const { error } = await supabaseClient
                .from("card_progress")
                .delete()
                .eq("user_id", currentUser.id)
                .eq("card_id", cardId);

            if (error) throw error;

            // Hapus dari progressMap
            delete progressMap[cardId];

        }

        // ==========================================
        // KALAU BELUM HAFAL → SIMPAN MASTERED
        // ==========================================

        else {

            const row = {
                user_id: currentUser.id,
                card_id: cardId,
                part: currentPart,
                status: "mastered",
                review_count: 1,
                updated_at: new Date().toISOString()
            };

            const { data, error } = await supabaseClient
                .from("card_progress")
                .upsert(
                    row,
                    {
                        onConflict: "user_id,card_id"
                    }
                )
                .select()
                .single();

            if (error) throw error;

            progressMap[cardId] = data;

        }

        // Update tampilan
        render();

        updateTotalProgress();

        // Update dropdown supaya angka ikut berubah
        initDropdown();

    } catch (error) {

        console.error(
            "Gagal mengubah status hafalan:",
            error
        );

        alert(
            "Gagal mengubah status hafalan:\n\n" +
            error.message
        );

    }
}

        /* =====================================================
           DROPDOWN
        ===================================================== */

        function initDropdown() {

            const list =
                document.getElementById(
                    "dropdownList"
                );


            list.innerHTML = "";


            for (let i = 1; i <= 40; i++) {

                const data =
                    allData[i] || [];


                const mastered =
                    data.filter(item => {

                        const id =
                            getCardId(i, item);

                        return progressMap[id]
                            ?.status ===
                            "mastered";

                    }).length;


                const btn =
                    document.createElement(
                        "button"
                    );


                btn.className =
                    `w-full flex items-center
                     justify-between px-4 py-3.5
                     text-xs font-bold rounded-2xl
                     transition-all mb-1
                     ${
                        i === currentPart
                        ? "active-part"
                        : "text-slate-500 hover:bg-slate-50"
                     }`;


                btn.innerHTML = `

                    <span>
                        Bagian ${i}
                    </span>

                    <span class="text-[8px]
                                 px-1.5 py-0.5
                                 rounded-md
                                 ${
                                    mastered === data.length &&
                                    data.length > 0
                                    ? "bg-green-100 text-green-600"
                                    : "bg-slate-100 text-slate-400"
                                 }">

                        ${mastered}/${data.length}

                    </span>

                `;


                btn.onclick = () => {

                    switchPart(i);

                    closeDropdown();
                };


                list.appendChild(btn);
            }
        }


        /* =====================================================
           SWITCH PART
        ===================================================== */

        function switchPart(n) {

            currentPart = n;


            currentData =
                [...(allData[n] || [])];


            currentIndex = 0;


            document.getElementById(
                "currentPartTitle"
            ).innerText =
                "Bagian " + n;


            initDropdown();

            render();
        }


        /* =====================================================
           RENDER
        ===================================================== */

        function render() {

            if (!currentData.length) {

                document.getElementById(
                    "kanjiDisplay"
                ).innerText = "?";


                document.getElementById(
                    "readingDisplay"
                ).innerText = "-";


                document.getElementById(
                    "meaningDisplay"
                ).innerText = "Tidak ada data";


                return;
            }


            const item =
                currentData[currentIndex];


            document.getElementById(
                "kanjiDisplay"
            ).innerText =
                item.k;


            document.getElementById(
                "readingDisplay"
            ).innerText =
                item.r;


            document.getElementById(
                "meaningDisplay"
            ).innerText =
                item.m;


            const mastered =
                isMastered(item);


            const button =
                document.getElementById(
                    "masteredButton"
                );


            if (mastered) {

                button.innerText =
                    "✓ Sudah Hafal";


                button.className =
                    `flex-1 mx-3 h-14
                     bg-green-500
                     text-white
                     rounded-[1.5rem]
                     font-black text-sm
                     active:scale-95
                     transition`;

            } else {

                button.innerText =
                    "✓ Tandai Sudah Hafal";


                button.className =
                    `flex-1 mx-3 h-14
                     bg-slate-900
                     text-white
                     rounded-[1.5rem]
                     font-black text-sm
                     active:scale-95
                     transition`;
            }


            const masteredCount =
                currentData.filter(
                    item => isMastered(item)
                ).length;


            const percentage =
                currentData.length
                    ? Math.round(
                        masteredCount /
                        currentData.length *
                        100
                    )
                    : 0;


            document.getElementById(
                "counterText"
            ).innerText =
                `${masteredCount} / ${currentData.length}`;


            document.getElementById(
                "percentageText"
            ).innerText =
                `${percentage}%`;


            document.getElementById(
                "progressBar"
            ).style.width =
                `${percentage}%`;


            resetFlip();
        }


        /* =====================================================
           FLIP
        ===================================================== */

        function flipCard() {

            flipped = !flipped;


            document.getElementById(
                "cardInner"
            ).classList.toggle(
                "rotate-y-180",
                flipped
            );
        }


        /* =====================================================
           RESET FLIP
        ===================================================== */

        function resetFlip() {

            flipped = false;


            document.getElementById(
                "cardInner"
            ).classList.remove(
                "rotate-y-180"
            );
        }


        /* =====================================================
           NEXT
        ===================================================== */

        function nextCard(event) {

            if (event) {
                event.stopPropagation();
            }


            if (!currentData.length) {
                return;
            }


            currentIndex =
                (currentIndex + 1)
                % currentData.length;


            render();
        }


        /* =====================================================
           PREVIOUS
        ===================================================== */

        function prevCard(event) {

            if (event) {
                event.stopPropagation();
            }


            if (!currentData.length) {
                return;
            }


            currentIndex =
                (currentIndex - 1 +
                 currentData.length)
                % currentData.length;


            render();
        }


        /* =====================================================
           SHUFFLE
        ===================================================== */

        function shuffleCurrentPart(event) {

            if (event) {
                event.stopPropagation();
            }


            if (currentData.length <= 1) {

                alert(
                    "Kartu tidak cukup untuk diacak."
                );

                return;
            }


            const card =
                document.getElementById(
                    "flashcard"
                );


            /* Animasi */

            card.classList.remove(
                "animate-shuffle"
            );


            void card.offsetWidth;


            card.classList.add(
                "animate-shuffle"
            );


            setTimeout(() => {

                card.classList.remove(
                    "animate-shuffle"
                );

            }, 400);


            /* Fisher-Yates Shuffle */

            for (
                let i = currentData.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                const temp =
                    currentData[i];


                currentData[i] =
                    currentData[j];


                currentData[j] =
                    temp;
            }


            /* Mulai dari awal */

            currentIndex = 0;


            /* Balik ke depan */

            resetFlip();


            /* Tampilkan kartu */

            render();
        }


        /* =====================================================
           TOTAL PROGRESS
        ===================================================== */

        function updateTotalProgress() {

            let total = 0;

            let mastered = 0;


            for (
                let part = 1;
                part <= 11;
                part++
            ) {

                const data =
                    allData[part] || [];


                total += data.length;


                for (const item of data) {

                    const id =
                        getCardId(
                            part,
                            item
                        );


                    if (
                        progressMap[id]
                        ?.status ===
                        "mastered"
                    ) {

                        mastered++;
                    }
                }
            }


            const percentage =
                total
                    ? Math.round(
                        mastered /
                        total *
                        100
                    )
                    : 0;


            document.getElementById(
                "totalProgressText"
            ).innerText =
                `${percentage}%`;


            document.getElementById(
                "totalProgressBar"
            ).style.width =
                `${percentage}%`;
        }


        /* =====================================================
           DROPDOWN OPEN / CLOSE
        ===================================================== */

        function toggleDropdown(e) {

            e.stopPropagation();


            const dd =
                document.getElementById(
                    "partDropdown"
                );


            const arrow =
                document.getElementById(
                    "dropdownArrow"
                );


            if (dd.classList.contains("hidden")) {

                dd.classList.remove("hidden");


                setTimeout(() => {

                    dd.classList.replace(
                        "opacity-0",
                        "opacity-100"
                    );


                    dd.classList.replace(
                        "-translate-y-4",
                        "translate-y-0"
                    );


                    arrow.style.transform =
                        "rotate(180deg)";

                }, 10);

            } else {

                closeDropdown();
            }
        }


        function closeDropdown() {

            const dd =
                document.getElementById(
                    "partDropdown"
                );


            const arrow =
                document.getElementById(
                    "dropdownArrow"
                );


            if (
                dd.classList.contains(
                    "hidden"
                )
            ) {
                return;
            }


            dd.classList.replace(
                "opacity-100",
                "opacity-0"
            );


            dd.classList.replace(
                "translate-y-0",
                "-translate-y-4"
            );


            arrow.style.transform =
                "rotate(0deg)";


            setTimeout(() => {

                dd.classList.add(
                    "hidden"
                );

            }, 300);
        }


        /* =====================================================
           PREVIEW
        ===================================================== */

        function togglePreview() {

            const modal =
                document.getElementById(
                    "previewModal"
                );


            const box =
                document.getElementById(
                    "modalBox"
                );


            if (
                modal.classList.contains(
                    "hidden"
                )
            ) {

                renderPreview();


                modal.classList.remove(
                    "hidden"
                );


                modal.classList.add(
                    "flex"
                );


                setTimeout(() => {

                    box.classList.replace(
                        "translate-y-full",
                        "translate-y-0"
                    );

                }, 10);

            } else {

                box.classList.replace(
                    "translate-y-0",
                    "translate-y-full"
                );


                setTimeout(() => {

                    modal.classList.add(
                        "hidden"
                    );


                    modal.classList.remove(
                        "flex"
                    );

                }, 500);
            }
        }


        /* =====================================================
           PREVIEW LIST
        ===================================================== */

        function renderPreview() {

            const content =
                document.getElementById(
                    "modalContent"
                );


            document.getElementById(
                "modalSub"
            ).innerText =
                `Bagian ${currentPart} • ${currentData.length} Item`;


            content.innerHTML =
                currentData.map(
                    (item, idx) => {

                        const mastered =
                            isMastered(item);


                        return `

                            <div
                                onclick="jumpTo(${idx})"
                                class="
                                    flex
                                    items-center
                                    justify-between
                                    p-5
                                    rounded-[2rem]
                                    cursor-pointer
                                    border-2
                                    transition-all
                                    ${
                                        mastered
                                        ? "mastered"
                                        : "bg-white border-slate-50"
                                    }
                                ">

                                <div class="
                                    flex
                                    items-center
                                    gap-5
                                ">

                                    <span class="
                                        text-3xl
                                        text-slate-900
                                    ">

                                        ${item.k}

                                    </span>


                                    <div>

                                        <span class="
                                            block
                                            text-xs
                                            font-black
                                            text-slate-800
                                        ">

                                            ${item.m}

                                        </span>


                                        <span class="
                                            block
                                            text-[10px]
                                            font-bold
                                            text-slate-400
                                            mt-1
                                        ">

                                            ${item.r}

                                        </span>

                                    </div>

                                </div>


                                <div class="text-lg">

                                    ${
                                        mastered
                                        ? "✓"
                                        : "○"
                                    }

                                </div>

                            </div>

                        `;

                    }
                ).join("");
        }


        /* =====================================================
           JUMP TO CARD
        ===================================================== */

        function jumpTo(idx) {

            currentIndex = idx;

            render();

            togglePreview();
        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        async function logout() {

            const yes =
                confirm(
                    "Yakin ingin keluar?"
                );


            if (!yes) {
                return;
            }


            await supabaseClient
                .auth
                .signOut();
        }


        /* =====================================================
           START
        ===================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            () => {

                checkSession();

            }
        );

    </script>

</body>

</html>
